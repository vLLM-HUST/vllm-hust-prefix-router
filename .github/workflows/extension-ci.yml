name: Extension CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -m build
      - name: Source-distribution tests outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          source_root="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "$source_root"
          source_dir="$source_root/vllm_hust_prefix_router-$(python -c 'from vllm_hust_prefix_router import __version__; print(__version__)')"
          test -f "$source_dir/scripts/check_delivery_manager.py"
          test -f "$source_dir/scripts/write_managed_lease.py"
          test -f "$source_dir/experiments/reliability/control_fault_matrix.py"
          test -f "$source_dir/experiments/sharegpt/run_matrix.py"
          python -m venv "$source_root/venv"
          source_python="$source_root/venv/bin/python"
          "$source_python" -m pip install "$source_dir[dev]"
          "$source_python" -m pip check
          unset PYTHONPATH PYTHONHOME
          (cd "$source_dir" && "$source_python" -m pytest -q)
      - name: Installed-wheel tests outside the source checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .wheel-check
          .wheel-check/bin/python -m pip install dist/*.whl 'pytest>=8,<10' 'pytest-asyncio>=0.24,<2'
          .wheel-check/bin/python -m pip check
          wheel_python="$PWD/.wheel-check/bin/python"
          test_root="$(mktemp -d)"
          cp -a tests "$test_root/tests"
          unset PYTHONPATH PYTHONHOME
          (cd "$test_root" && "$wheel_python" -m pytest -q tests --ignore=tests/test_sharegpt_experiment.py)
      - name: Verify clean-wheel ECPA posture
        if: matrix.python == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          .wheel-check/bin/python -m pip install \
            "vllm-hust-ext @ git+https://github.com/vLLM-HUST/extension-manager.git@a78c9681ee428589dc7666c0c159cb24c3f0c58a"
          export XDG_CONFIG_HOME="$PWD/.ecpa-state/config"
          export XDG_STATE_HOME="$PWD/.ecpa-state/state"
          export XDG_CACHE_HOME="$PWD/.ecpa-state/cache"
          cli=.wheel-check/bin/vllm-hust-ext
          "$cli" extension list \
            | grep 'org.vllm-hust.prefix-router 0.1.0a1 disabled'
          "$cli" extension inspect org.vllm-hust.prefix-router \
            | grep 'vllm.request-routing.front-door'
          "$cli" extension validate org.vllm-hust.prefix-router \
            | grep '"activation_ready": true'
          "$cli" extension check org.vllm-hust.prefix-router \
            | grep 'Router configuration is not bound'
          "$cli" extension plan org.vllm-hust.prefix-router \
            | grep '"operation": "check_external_router"'
          "$cli" extension render org.vllm-hust.prefix-router \
            | grep 'prefix-router-operator-plan.json'
          "$cli" extension enable org.vllm-hust.prefix-router
          if "$cli" run --dry-run -- python -c pass; then
            echo 'unverified external services were unexpectedly accepted' >&2
            exit 1
          fi
          "$cli" extension disable org.vllm-hust.prefix-router
          "$cli" extension forget org.vllm-hust.prefix-router
          "$cli" run --dry-run -- python -c pass >.ecpa-run.json
          if grep -q 'PREFIX_ROUTER' .ecpa-run.json; then
            echo 'disabled service unexpectedly changed the native path' >&2
            exit 1
          fi
          .wheel-check/bin/python scripts/check_delivery_manager.py \
            --output "$RUNNER_TEMP/router-manager-delivery" \
            --uninstall-from-disposable-venv
